[package]
name = "gosh-zk-snark-halo2-utils"
version = "0.1.0"
edition = "2021"

[dependencies]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "main", default-features = false, features = ["halo2-axiom"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"

[dev-dependencies]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "main", default-features = false, features = ["halo2-axiom", "test-utils"] }
bk-set-change-verifier-halo2-circuit-with-better-sha256 = { git = "https://github.com/gosh-sh/bk-set-change-verifier-halo2-circuit-with-better-sha256", branch = "main" }
bk-set-block-data-gen = { git = "https://github.com/gosh-sh/bk-set-change-verifier-halo2-circuit-with-better-sha256", branch = "main" }
layer-hashes-update-halo2-circuit = { git = "https://github.com/gosh-sh/layer-hashes-update-halo2-circuit", branch = "main" }
gosh-dense-balanced-tree = { git = "https://github.com/gosh-sh/gosh-halo2-crypto-lib", branch = "main" }
hex = "0.4"

[patch.crates-io]
halo2-base = { git = "https://github.com/gosh-sh/halo2-lib-zkevm-sha256-and-bls12-381", branch = "main" }

[profile.dev]
opt-level = 3

